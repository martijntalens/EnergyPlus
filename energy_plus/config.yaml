name: Energie+
version: "0.3.0"
slug: energy_plus
description: Extra, more detailed energy dashboard next to the built-in Energy dashboard
url: https://github.com/martijntalens/EnergyPlus
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:lightning-bolt-circle
panel_title: Energie+
homeassistant_api: true
options:
  grid_power_entity: ""
  grid_power_export_entity: ""
  solar_power_entity: ""
  battery_power_entity: ""
  battery_soc_entity: ""
  co2_signal_entity: ""
  live_refresh_seconds: 5
  household_size: 0
  device_power_entities: []
schema:
  grid_power_entity: str?
  grid_power_export_entity: str?
  solar_power_entity: str?
  battery_power_entity: str?
  battery_soc_entity: str?
  co2_signal_entity: str?
  live_refresh_seconds: int(2,60)?
  household_size: int(0,12)?
  device_power_entities:
    - str
